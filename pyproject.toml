[project]
name = "fakenews-detector"
version = "0.1.0"
description = "Evidence-grounded, explainable 5-class fake news & misinformation detector (KIET NLP semester project)"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "data", "notebooks", "paper"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
